syntax = "proto3";

package scylla.pipeline.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";
import "scylla/exec/v1/step.proto";

// Pipelines: the DAG blueprints a project runs. RunPipeline creates one Job
// per call and returns its id; read the run with JobService.GetJob.
service PipelineService {
  // Requires `createPipeline` on the project.
  rpc CreatePipeline(CreatePipelineRequest) returns (CreatePipelineResponse);
  // Requires `readPipeline` on the pipeline.
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse);
  // Requires `updatePipeline` on the pipeline. Changes only what the request
  // carries. A failed validation leaves the pipeline as it was. A job created
  // before the update runs the nodes it was created with. Fails with ABORTED
  // and changes nothing when the pipeline changed since the server read it;
  // read it again and retry.
  rpc UpdatePipeline(UpdatePipelineRequest) returns (UpdatePipelineResponse);
  // Requires `deletePipeline` on the pipeline. Deletes the pipeline together
  // with its jobs, their logs and its triggers. The agents that hold its
  // pending or running jobs get a CancelJob frame after the delete. Fails
  // with ABORTED and changes nothing when the pipeline changed since the
  // server read it; read it again and retry.
  rpc DeletePipeline(DeletePipelineRequest) returns (DeletePipelineResponse);
  // Requires `listPipelines`, a system-scope permission. Returns every
  // pipeline of every organization, newest first.
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);
  // Requires `listPipelinesByProject` on the project. Newest first.
  rpc ListProjectPipelines(ListProjectPipelinesRequest) returns (ListProjectPipelinesResponse);
  // Requires `listPipelinesByOrganization` on the organization. Newest first.
  rpc ListOrganizationPipelines(ListOrganizationPipelinesRequest) returns (ListOrganizationPipelinesResponse);
  // Requires `runPipeline` on the pipeline. Resolves every secret_ref and
  // measures the resolved job before it stores anything: a name that matches
  // no project secret fails with NOT_FOUND, and a resolved job larger than
  // 8 MiB fails with INVALID_ARGUMENT. Neither stores a job. Otherwise it
  // stores one pending job, which runs the nodes of the pipeline as they are
  // now. The operating system of the agent also limits the env and the
  // arguments of one process (about 1 MiB on macOS); a node that passes
  // that limit fails when it starts. A connected agent that holds `executeJob` on the pipeline and has no
  // job that has not ended receives the job right after the response;
  // otherwise the job stays pending until such an agent is free.
  rpc RunPipeline(RunPipelineRequest) returns (RunPipelineResponse);
}

// One node of the DAG. The agent starts a node when each of its deps has
// completed, so independent nodes run concurrently. When a node fails, the
// agent stops the running nodes, skips the nodes that did not start, and
// fails the job.
message PipelineNode {
  scylla.common.v1.NodeId node_id = 1;
  // Ids of other nodes of the same pipeline; no self, no duplicate, no id
  // missing from the pipeline's nodes. Empty: the node starts first. A
  // dependency cycle fails with FAILED_PRECONDITION.
  repeated scylla.common.v1.NodeId deps = 2;
  // Relative to the job workspace; the agent creates it when missing.
  // Trimmed; "" means the root; no leading "/" or "\", no ".." segment; at
  // most 4096 bytes.
  string working_dir = 3;
  // At most 128 entries; keys unique within the node.
  repeated EnvVar env = 4;

  // Required.
  oneof step {
    scylla.exec.v1.ExecStep exec = 10;
    scylla.exec.v1.ScriptStep script = 11;
  }
}

// One environment variable of a node's step process.
message EnvVar {
  // Trimmed; starts with an ASCII letter or "_"; ASCII letters, digits and
  // "_" only; at most 255 bytes. The prefix "SCYLLA_" is reserved for the
  // agent.
  string key = 1;
  // Required.
  oneof source {
    // Used as-is; at most 65536 bytes.
    string value = 2;
    // Name of a secret of the pipeline's project, not its id. Trimmed; 1 to
    // 128 bytes of ASCII letters, digits, "-", "_" and ".". Create and
    // Update check the format only; RunPipeline resolves it. Job logs show
    // "***" in place of each line of the resolved value that has at least 4
    // characters; a shorter line shows as-is.
    string secret_ref = 3;
  }
}

// A pipeline with its full node list.
message Pipeline {
  scylla.common.v1.PipelineId pipeline_id = 1;
  scylla.common.v1.ProjectId project_id = 2;
  // Trimmed; not unique within the project.
  string name = 3;
  // At least one node.
  repeated PipelineNode nodes = 4;
  google.protobuf.Timestamp created_at = 5;
  // Equals created_at until UpdatePipeline carries a name or a node list.
  google.protobuf.Timestamp updated_at = 6;
}

// A pipeline without its nodes, as the list RPCs return it. Fetch the nodes
// with GetPipeline.
message PipelineSummary {
  scylla.common.v1.PipelineId pipeline_id = 1;
  scylla.common.v1.ProjectId project_id = 2;
  string name = 3;
  uint32 node_count = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreatePipelineRequest {
  scylla.common.v1.ProjectId project_id = 1;
  // Trimmed; 1 to 255 bytes.
  string name = 2;
  // 1 to 256 nodes; node ids unique within the list.
  repeated PipelineNode nodes = 3;
}

message CreatePipelineResponse {
  Pipeline pipeline = 1;
}

message GetPipelineRequest {
  scylla.common.v1.PipelineId pipeline_id = 1;
}

message GetPipelineResponse {
  Pipeline pipeline = 1;
}

message UpdatePipelineRequest {
  scylla.common.v1.PipelineId pipeline_id = 1;
  // Absent: kept. Present: same rules as CreatePipelineRequest.name.
  optional string name = 2;
  // Empty: kept. Otherwise replaces the whole node list; same rules as
  // CreatePipelineRequest.nodes.
  repeated PipelineNode nodes = 3;
}

message UpdatePipelineResponse {
  Pipeline pipeline = 1;
}

message DeletePipelineRequest {
  scylla.common.v1.PipelineId pipeline_id = 1;
}

message DeletePipelineResponse {}

message ListPipelinesRequest {
  scylla.common.v1.PaginationRequest pagination = 1;
}

message ListPipelinesResponse {
  repeated PipelineSummary pipelines = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListProjectPipelinesRequest {
  scylla.common.v1.ProjectId project_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListProjectPipelinesResponse {
  repeated PipelineSummary pipelines = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListOrganizationPipelinesRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListOrganizationPipelinesResponse {
  repeated PipelineSummary pipelines = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message RunPipelineRequest {
  scylla.common.v1.PipelineId pipeline_id = 1;
}

message RunPipelineResponse {
  scylla.common.v1.JobId job_id = 1;
}
