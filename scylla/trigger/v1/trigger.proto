syntax = "proto3";

package scylla.trigger.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// A trigger starts a run of one pipeline without a PipelineService.RunPipeline
// call. A cron trigger fires on a UTC schedule; a webhook trigger fires when
// an external system POSTs a signed body to its URL. A pipeline may hold
// several triggers. A fire mints one Job through the same path as a manual
// run. The run executes as the trigger-runner App of the pipeline's
// organization: the server marks that App as the runner and names it
// "trigger-runner". It holds the organization-trigger-runner role, which
// grants runPipeline only, and it has no secret. The first CreateTrigger in an
// organization provisions it. AppService.CreateApp and
// AgentAdminService.CreateAgent refuse the name "trigger-runner", and
// AppService.DeleteApp, SetAppActive and CreateAppSecret refuse this App with
// FAILED_PRECONDITION. If an App that is not the runner already holds the
// name, CreateTrigger fails with ALREADY_EXISTS until that App is deleted.
//
// An RPC that takes a `trigger_id` checks the permission on the trigger; a
// grant on the trigger's project reaches it. An unknown trigger_id has no
// project: it fails with PERMISSION_DENIED, and with NOT_FOUND only for a
// System grant.
service TriggerService {
  // Requires `manageTriggers` and `runPipeline` on `pipeline_id`. The new
  // trigger is enabled. A webhook secret is returned only here.
  rpc CreateTrigger(CreateTriggerRequest) returns (CreateTriggerResponse);
  // Requires `manageTriggers` on the trigger.
  rpc GetTrigger(GetTriggerRequest) returns (GetTriggerResponse);
  // Requires `manageTriggers` and `runPipeline` on the trigger.
  // Replaces name, source spec and inputs, not the enabled state. The source
  // kind cannot change: the other kind fails with FAILED_PRECONDITION; delete
  // and recreate instead. A cron source's next occurrence is recomputed from
  // now; a webhook's signing secret is kept. Fails with ABORTED and changes
  // nothing when the trigger changed since the server read it; read it again
  // and retry.
  rpc UpdateTrigger(UpdateTriggerRequest) returns (UpdateTriggerResponse);
  // Requires `manageTriggers` on the trigger. Fails with ABORTED and changes
  // nothing when the trigger changed since the server read it; read it again
  // and retry.
  rpc DeleteTrigger(DeleteTriggerRequest) returns (DeleteTriggerResponse);
  // Requires `manageTriggers` on `pipeline_id`. Every trigger, oldest first,
  // no pagination.
  rpc ListPipelineTriggers(ListPipelineTriggersRequest) returns (ListPipelineTriggersResponse);
  // Requires `manageTriggers` on the trigger. A disabled trigger
  // never fires and its webhook URL answers 404, as for an unknown id.
  // Re-enabling a cron trigger schedules the next occurrence from now;
  // occurrences missed while disabled do not fire. Fails with ABORTED and
  // changes nothing when the trigger changed since the server read it; read
  // it again and retry.
  rpc SetTriggerEnabled(SetTriggerEnabledRequest) returns (SetTriggerEnabledResponse);
  // Requires `runPipeline` on the trigger. Mints and dispatches a
  // Job like a real fire and records a FireObservation, ignoring the cron
  // schedule and without a signed delivery. There is no payload, so
  // json_pointer inputs are skipped. A disabled trigger fails with
  // FAILED_PRECONDITION.
  rpc FireTriggerNow(FireTriggerNowRequest) returns (FireTriggerNowResponse);
}

// ── Source specs (write side) ──────────────────────────────────────────────

// Exactly five fields (minute, hour, day-of-month, month, day-of-week),
// evaluated in UTC. A sixth field for seconds is rejected, so the finest
// granularity is one minute. The server rejects an expression that does not
// parse or has no upcoming occurrence. When several occurrences were missed,
// for example during downtime, the trigger fires once and computes the next
// one from now.
message CronSpec {
  // Trimmed. Example: "0 9 * * 1-5" fires at 09:00 UTC on weekdays.
  string expression = 1;
}

// The sender computes HMAC-SHA256 over the raw request body with the signing
// secret (see CreateTriggerResponse.webhook_secret). It sends the hex digest,
// with or without a "sha256=" prefix, in the signature header. The prefix and
// the hex digits are accepted in any case. A missing or wrong signature
// answers 401. A delivery id in the X-Scylla-Delivery or X-GitHub-Delivery
// header deduplicates: a repeated id answers 200 and does not fire again.
// Without one, the digest is the dedupe key, so the prefixed and the bare
// form of one signature are one delivery. An accepted delivery answers 202; a
// JSON body feeds the json_pointer inputs. A delivery whose fire fails is not
// recorded, so a retry with the same delivery id fires: a payload value that
// a run cannot use answers 422, any other failure answers 500.
// A signed delivery whose X-Scylla-Event or X-GitHub-Event header is "ping"
// answers 200 and does not fire: GitHub sends one when the webhook is
// created, and a sender can use it to check the URL and the secret.
message WebhookSpec {
  // Empty selects "X-Scylla-Signature-256"; GitHub uses "X-Hub-Signature-256".
  // Otherwise an HTTP header name: ASCII letters, digits and
  // !#$%&'*+-.^_`|~; at most 255 bytes.
  string signature_header = 1;
}

// One environment variable added, unmasked, to every node of the run. A key
// already set on a node keeps the node's value. An input cannot reference a
// secret.
message TriggerInput {
  // Unique within the trigger. ASCII letters, digits and underscores, not
  // starting with a digit or with "SCYLLA_"; at most 255 bytes.
  string key = 1;
  // Required.
  oneof source {
    // Allowed on cron and webhook triggers. At most 65536 bytes.
    string literal = 2;
    // RFC 6901 pointer into the webhook payload, for example "/after"; must
    // start with "/", and every "~" is followed by "0" or "1"; at most 1024
    // bytes. Webhook triggers only. Skipped when it does not resolve
    // or the fire has no payload. A non-string value arrives as JSON text.
    string json_pointer = 3;
  }
}

// ── Read model ─────────────────────────────────────────────────────────────

message Trigger {
  scylla.common.v1.TriggerId trigger_id = 1;
  scylla.common.v1.PipelineId pipeline_id = 2;
  string name = 3;
  repeated TriggerInput inputs = 4;
  // Absent until the first fire from any path: schedule, webhook delivery or
  // FireTriggerNow.
  FireObservation last_observation = 5;
  google.protobuf.Timestamp created_at = 6;
  // Changes on CreateTrigger, UpdateTrigger and SetTriggerEnabled. A fire and
  // a cron schedule advance do not change it (see last_observation).
  google.protobuf.Timestamp updated_at = 7;

  oneof source {
    Cron cron = 10;
    Webhook webhook = 11;
  }

  oneof activation {
    Disabled disabled = 20;
    Enabled enabled = 21;
  }

  message Cron {
    string expression = 1;
  }
  message Webhook {
    // Empty when the trigger uses the default "X-Scylla-Signature-256".
    string signature_header = 1;
    // "<base>/webhooks/<trigger_id>". Empty when the server has no webhook
    // base URL configured.
    string url = 2;
  }

  message Disabled {}
  message Enabled {
    // UTC. Absent for a webhook trigger, and for a cron trigger whose next
    // occurrence is not computed yet.
    google.protobuf.Timestamp next_fire_at = 1;
  }
}

message FireObservation {
  google.protobuf.Timestamp fired_at = 1;

  oneof result {
    Succeeded succeeded = 2;
    Failed failed = 3;
  }

  // A Job was minted and handed to dispatch; a run left pending because no
  // agent was available still counts. Says nothing about how the Job ran.
  message Succeeded {}
  // The fire raised an error. `error` holds the recorded status text: the
  // server writes "error", with no failure detail.
  message Failed {
    string error = 1;
  }
}

// ── CRUD ───────────────────────────────────────────────────────────────────

message CreateTriggerRequest {
  scylla.common.v1.PipelineId pipeline_id = 1;
  // Trimmed; 1 to 255 bytes of UTF-8. Unique within the pipeline: a name
  // that is taken fails with ALREADY_EXISTS.
  string name = 2;
  // At most 128.
  repeated TriggerInput inputs = 3;

  // Required.
  oneof source {
    CronSpec cron = 10;
    WebhookSpec webhook = 11;
  }
}

message CreateTriggerResponse {
  Trigger trigger = 1;
  // Set only for a webhook source: the plaintext signing secret, 64 hex
  // characters. No later call returns it, and a Trigger never carries it.
  optional string webhook_secret = 2;
}

message GetTriggerRequest {
  scylla.common.v1.TriggerId trigger_id = 1;
}

message GetTriggerResponse {
  Trigger trigger = 1;
}

message UpdateTriggerRequest {
  scylla.common.v1.TriggerId trigger_id = 1;
  // Required despite the `optional` label. Trimmed; 1 to 255 bytes of UTF-8.
  // Unique within the pipeline: a name that is taken fails with
  // ALREADY_EXISTS.
  optional string name = 2;
  // Replaces the whole list; an empty list removes every input. At most 128.
  repeated TriggerInput inputs = 3;

  // Required.
  oneof source {
    CronSpec cron = 10;
    WebhookSpec webhook = 11;
  }
}

message UpdateTriggerResponse {
  Trigger trigger = 1;
}

message DeleteTriggerRequest {
  scylla.common.v1.TriggerId trigger_id = 1;
}

message DeleteTriggerResponse {}

message ListPipelineTriggersRequest {
  scylla.common.v1.PipelineId pipeline_id = 1;
}

message ListPipelineTriggersResponse {
  repeated Trigger triggers = 1;
}

message SetTriggerEnabledRequest {
  scylla.common.v1.TriggerId trigger_id = 1;
  bool enabled = 2;
}

message SetTriggerEnabledResponse {
  Trigger trigger = 1;
}

message FireTriggerNowRequest {
  scylla.common.v1.TriggerId trigger_id = 1;
}

// The Job's origin names this trigger.
message FireTriggerNowResponse {
  scylla.common.v1.JobId job_id = 1;
}
