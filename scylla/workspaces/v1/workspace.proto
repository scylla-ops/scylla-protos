syntax = "proto3";

package scylla.workspaces.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";

// A workspace: the top-level container of the projects and the agents.
message Workspace {
  // The id of the workspace.
  scylla.common.v1.Id id = 1;
  // The display name, 1 to 100 characters, trimmed.
  string name = 2;
  // The unique short name for the URLs: 2 to 39 lower case letters, digits or dashes, that
  // start and end with a letter or a digit.
  string slug = 3;
  // The creation time. The server sets it.
  google.protobuf.Timestamp created_at = 4;
  // True when the personal tokens of the users act in this workspace. False: each call of a
  // personal token on this workspace gets PERMISSION_DENIED.
  bool personal_tokens_enabled = 5;
}
