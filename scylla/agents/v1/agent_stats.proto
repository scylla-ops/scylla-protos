syntax = "proto3";

package scylla.agents.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";

// The job stats of an agent for the last 30 days in UTC, today included. A job counts on the
// day of its creation, and only when it ended: a pending or running job is in no count.
message AgentStats {
  // The agent.
  scylla.common.v1.Id agent_id = 1;
  // The jobs of the 30 days, by their end.
  JobOutcomes outcomes = 2;
  // The median time from the start to the end of the jobs of the 30 days that started and
  // ended. Not set when no job did.
  google.protobuf.Duration median_duration = 3;
  // The 95th percentile of the same times. Not set when no job did.
  google.protobuf.Duration p95_duration = 4;
  // The 30 days, oldest first, also the days with no job.
  repeated DayOutcomes days = 5;
}

// The number of jobs for each end.
message JobOutcomes {
  // The jobs that completed.
  uint32 completed = 1;
  // The jobs that failed.
  uint32 failed = 2;
  // The jobs that a user cancelled.
  uint32 cancelled = 3;
  // The jobs that ended because their agent went away or was disabled.
  uint32 orphaned = 4;
}

// The jobs of one day.
message DayOutcomes {
  // The start of the day, at 00:00 UTC.
  google.protobuf.Timestamp day = 1;
  // The jobs created on that day, by their end.
  JobOutcomes outcomes = 2;
}
