syntax = "proto3";

package scylla.common.v1;

import "scylla/common/v1/id.proto";

// A glyph of the icon set of the web app, with a color.
message IconGlyph {
  // The name of the glyph in the icon set of the web app, for example "rocket": 1 to 64 lower
  // case letters, digits or dashes, with a letter or a digit first. The server does not know the
  // icon set: a client shows its default glyph for a name that it does not know.
  string name = 1;
  // The color of the glyph: the name of a color of the web app (1 to 32 lower case letters,
  // digits or dashes, with a letter first, for example "blue"), or "#rrggbb". The server keeps a
  // "#rrggbb" color in lower case. Empty means the default color.
  string color = 2;
}

// The custom icon of a resource: a glyph with a color, or an uploaded image. A resource with no
// custom icon shows its default icon.
message Icon {
  // The kind of the icon. One is always set.
  oneof kind {
    // A glyph of the icon set with a color.
    IconGlyph glyph = 1;
    // The id of an uploaded image. The route GET /images/{id} of the server gives it, as a
    // square PNG of 256 pixels with the content type image/png. The image of an id never
    // changes: a new upload gives a new id.
    Id image_id = 2;
  }
  // The options of the glyph avatar that the server drew as the image, so that a client opens its
  // editor with them. Set only with image_id, when the image is a glyph avatar of an App, and
  // only in the reads of the App itself (GetApp, ListApps and the answers of the App routes). The
  // image of a glyph avatar is an SVG with the content type image/svg+xml.
  GlyphAvatar glyph_avatar = 3;
}

// A change of the custom icon of a resource. With no kind set, the resource takes its default
// icon again.
message IconChange {
  // The new icon. Not set removes the custom icon.
  oneof kind {
    // A glyph of the icon set with a color.
    IconGlyph glyph = 1;
    // A new image: a PNG, JPEG or WebP file of at most 1048576 bytes (1 MiB), and at most 4096
    // pixels on each side. The server makes it a square PNG of 256 pixels: it cuts the center
    // of the longer side. Another format (SVG too), a larger file or a file that it cannot read
    // gives INVALID_ARGUMENT.
    bytes image = 2;
    // A glyph avatar that the server draws as an SVG image. Only an App takes one: a project or
    // a workspace gives INVALID_ARGUMENT. Bad options give INVALID_ARGUMENT.
    GlyphAvatar glyph_avatar = 3;
  }
}

// The avatar of a person: an uploaded image, and the color of the initials. With no image, the
// clients show the initials of the person on the color.
message Avatar {
  // The id of the uploaded image. Not set: the person has no image. The route GET /images/{id}
  // of the server gives it, as a square PNG of 256 pixels with the content type image/png.
  Id image_id = 1;
  // The color of the initials: the name of a color of the web app (1 to 32 lower case letters,
  // digits or dashes, with a letter first, for example "blue"), or "#rrggbb" in lower case.
  // Empty means the default color.
  string color = 2;
  // The options of the glyph avatar that the server drew as the image, so that a client opens its
  // editor with them. Set only with image_id, when the image is a glyph avatar, and only in the
  // reads of a user (GetMe, UpdateProfile, ImportAvatar, ListUsers). The image of a glyph avatar
  // is an SVG with the content type image/svg+xml.
  GlyphAvatar glyph_avatar = 3;
}

// An avatar of the DiceBear style "Glyphs" (by Matt Houser, CC BY 4.0): a shoulder silhouette
// with a headpiece in a tinted square. The server draws it as an SVG with dicebear-core 11, and a
// client draws the same SVG with @dicebear/core 11 for a preview. Each value is explicit, so the
// same options always give the same image.
message GlyphAvatar {
  // The headpiece: "variant01" to "variant35" for the shapes of the style, or "scylla" for the
  // Scylla head, the four dots of the Scylla mark.
  string shape = 1;
  // The paint of the headpiece and of the shoulders. Required.
  GlyphPaint glyph = 2;
  // The paint of the background. Not set: solid white.
  GlyphPaint background = 3;
  // The mirror of the figure.
  GlyphFlip flip = 4;
  // The rotation of the figure, in degrees: -360 to 360.
  int32 rotate = 5;
  // The size of the figure, in percent: 50 to 150. 0 gives 100.
  int32 scale = 6;
}

// The paint of a part of a glyph avatar: one color, or a gradient of colors.
message GlyphPaint {
  // The colors, each "#rrggbb": one color for a solid fill, 2 to 4 colors for a gradient, in
  // their order. The server keeps them in lower case.
  repeated string colors = 1;
  // The fill.
  GlyphFill fill = 2;
  // The direction of a linear gradient, in degrees: -360 to 360. 0 goes from left to right.
  int32 angle = 3;
}

// The fill of a part of a glyph avatar.
enum GlyphFill {
  // A solid fill: the first color.
  GLYPH_FILL_UNSPECIFIED = 0;
  // A linear gradient, in the direction of the angle.
  GLYPH_FILL_LINEAR = 1;
  // A radial gradient, from the center.
  GLYPH_FILL_RADIAL = 2;
}

// The mirror of a glyph avatar.
enum GlyphFlip {
  // No mirror.
  GLYPH_FLIP_UNSPECIFIED = 0;
  // A mirror from left to right.
  GLYPH_FLIP_HORIZONTAL = 1;
  // A mirror from top to bottom.
  GLYPH_FLIP_VERTICAL = 2;
  // The two mirrors.
  GLYPH_FLIP_BOTH = 3;
}
