syntax = "proto3";

package scylla.apps.v1;

import "google/protobuf/timestamp.proto";
import "scylla/auth/v1/api_token.proto";
import "scylla/common/v1/id.proto";

// An App: the machine identity of a workspace. It proves its identity with an Ed25519 key pair
// that it made, and gets its rights from roles given with AccessService.Grant. An agent is an App
// that can run jobs: it keeps a stream open with AgentService.OpenStream.
message App {
  // The id of the App. It is also the id of its actor.
  scylla.common.v1.Id id = 1;
  // The workspace of the App.
  scylla.common.v1.Id workspace_id = 2;
  // The display name.
  string name = 3;
  // True if the App is an agent: it can run jobs and open the stream of AgentService.
  bool runner = 4;
  // The actor that created the App.
  scylla.common.v1.Id created_by = 5;
  // The creation time.
  google.protobuf.Timestamp created_at = 6;
  // True while the agent has an open stream on this server.
  bool connected = 7;
  // The last time that the agent opened its stream, renewed its token or closed its stream. Not
  // set before its first stream.
  google.protobuf.Timestamp last_seen_at = 8;
  // The host of the agent, from the hello of its last stream. Not set before its first stream.
  Host host = 9;
  // The time when an admin disabled the App. Not set while it is enabled. A disabled App gets
  // no token and no job.
  google.protobuf.Timestamp disabled_at = 10;
  // The number of jobs that the agent holds now: the jobs that it took and that did not end.
  // Compare with host.capacity. ListJobs with agent_id gives these jobs.
  uint32 running_jobs = 11;
}

// The machine of an agent, as the agent tells it in its hello.
message Host {
  // The version of the agent.
  string version = 1;
  // The operating system, for example linux.
  string os = 2;
  // The CPU architecture, for example x86_64.
  string arch = 3;
  // The host name.
  string hostname = 4;
  // The number of CPUs.
  uint32 cpu_count = 5;
  // The memory in bytes.
  uint64 memory_bytes = 6;
  // The largest number of jobs that the agent runs at the same time, at least 1.
  uint32 capacity = 7;
  // The container runtime of the agent, for example docker. Empty if the agent has none: a step
  // in a container never goes to this agent.
  string container_runtime = 8;
}

// A public key of an App.
message AppKey {
  // The id of the key, to put in each AppAssertion.
  scylla.common.v1.Id id = 1;
  // The Ed25519 public key, 32 bytes.
  bytes public_key = 2;
  // The time when the key was added.
  google.protobuf.Timestamp created_at = 3;
  // The time when the key was revoked. Not set for an active key.
  google.protobuf.Timestamp revoked_at = 4;
  // The name of the key, for example the host name of its machine. Empty if it has none.
  string label = 5;
  // The last time that the key signed an assertion for a token. Not set before its first use.
  google.protobuf.Timestamp last_used_at = 6;
}

// A CI identity of an App: the jobs of a repository of a CI provider get a token of the App with
// the ID token of their job, with no secret. TokenService.ExchangeCiToken checks the ID token.
message CiIdentity {
  // The id of the CI identity.
  scylla.common.v1.Id id = 1;
  // The App.
  scylla.common.v1.Id app_id = 2;
  // The CI provider.
  CiProvider provider = 3;
  // The issuer of the ID tokens, for example https://token.actions.githubusercontent.com or
  // https://gitlab.com.
  string issuer = 4;
  // The repository: owner/repo on GitHub, group/project on GitLab.
  string repository = 5;
  // The Git ref of the job: refs/heads/main on GitHub, main on GitLab. Empty: each ref.
  string git_ref = 6;
  // The environment of the job. Empty: each environment, and no environment.
  string environment = 7;
  // What the tokens of the CI jobs can do, inside the rights of the App.
  scylla.auth.v1.TokenLimits limits = 8;
  // The actor that added the CI identity.
  scylla.common.v1.Id created_by = 9;
  // The time when it was added.
  google.protobuf.Timestamp created_at = 10;
  // The last exchange of an ID token. Not set before the first one.
  google.protobuf.Timestamp last_used_at = 11;
}

// A CI provider.
enum CiProvider {
  // Not used.
  CI_PROVIDER_UNSPECIFIED = 0;
  // GitHub Actions: the claims repository, ref and environment.
  CI_PROVIDER_GITHUB = 1;
  // GitLab CI: the claims project_path, ref and environment.
  CI_PROVIDER_GITLAB = 2;
}
