syntax = "proto3";

package scylla.apps.v1;

import "google/protobuf/timestamp.proto";
import "scylla/apps/v1/app.proto";
import "scylla/auth/v1/api_token.proto";
import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";

// Creates, reads, lists and deletes the Apps of a workspace, and changes their keys. Each RPC
// needs an authenticated actor, else UNAUTHENTICATED. An unknown App gives PERMISSION_DENIED, as
// a refusal does.
service AppService {
  // Creates an App in a workspace, with no key and no role, and gives a join code. The machine
  // of the App sends the code and its public key to TokenService.JoinApp. The admins and the
  // owners of the workspace create Apps.
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse);
  // Reads one App and its keys. The readers of the workspace read its Apps.
  rpc GetApp(GetAppRequest) returns (GetAppResponse);
  // Lists the Apps of a workspace, oldest first.
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  // Deletes an App with its keys and its roles. Its tokens stop at once, and its stream closes.
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse);
  // Disables an App: its tokens stop at once, its stream closes, and it gets no new token. The
  // jobs that its agent runs end as orphaned, and its jobs that did not start go back to the
  // pool. A second call keeps the first time. The admins of the workspace disable an App.
  rpc DisableApp(DisableAppRequest) returns (DisableAppResponse);
  // Enables a disabled App again: it gets tokens again, and its agent connects at its next
  // try. An enabled App does not change. The admins of the workspace enable an App.
  rpc EnableApp(EnableAppRequest) returns (EnableAppResponse);
  // Gives a new join code for an App. The previous open codes of the App stop.
  rpc CreateJoinCode(CreateJoinCodeRequest) returns (CreateJoinCodeResponse);
  // Adds a public key to an App, for example before a rotation. The App made the key pair.
  rpc AddAppKey(AddAppKeyRequest) returns (AddAppKeyResponse);
  // Revokes a key of an App. The tokens of this key stop at once, and the stream of the App
  // closes with ABORTED: the agent connects again with another key.
  rpc RevokeAppKey(RevokeAppKeyRequest) returns (RevokeAppKeyResponse);
  // Gives a new name to a key of an App: one line, 1 to 100 characters, else
  // INVALID_ARGUMENT. An unknown key gives NOT_FOUND. The admins of the workspace rename a key.
  rpc RenameAppKey(RenameAppKeyRequest) returns (RenameAppKeyResponse);
  // Creates an API token of an App. The response has its secret one time: the server keeps only
  // a hash. The route permission is create_app_token: the admins of the workspace.
  rpc CreateAppToken(CreateAppTokenRequest) returns (CreateAppTokenResponse);
  // Lists the API tokens of an App, the newest first, with the revoked and the expired ones. The
  // route permission is list_app_tokens: the readers of the workspace.
  rpc ListAppTokens(ListAppTokensRequest) returns (ListAppTokensResponse);
  // Revokes an API token of an App: its short tokens stop at once. A token of another App gives
  // NOT_FOUND. The route permission is revoke_app_token: the admins of the workspace.
  rpc RevokeAppToken(RevokeAppTokenRequest) returns (RevokeAppTokenResponse);
}

// The input of CreateApp.
message CreateAppRequest {
  // The workspace of the new App. Required.
  scylla.common.v1.Id workspace_id = 1;
  // The display name, 1 to 100 characters after trim, on one line.
  string name = 2;
  // True for an agent: an App that runs jobs. False for a client such as a CI or a script.
  bool runner = 3;
}

// The output of CreateApp.
message CreateAppResponse {
  // The new App.
  App app = 1;
  // The join code: one use, it expires at join_code_expires_at. The server keeps only its hash.
  string join_code = 2;
  // The end of the validity of the join code.
  google.protobuf.Timestamp join_code_expires_at = 3;
}

// The input of GetApp.
message GetAppRequest {
  // The App to read. Required.
  scylla.common.v1.Id app_id = 1;
}

// The output of GetApp.
message GetAppResponse {
  // The App.
  App app = 1;
  // The keys of the App, the revoked keys too, oldest first.
  repeated AppKey keys = 2;
}

// The input of ListApps.
message ListAppsRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
  // Only the agents if true, only the other Apps if false. Not set gives all the Apps.
  optional bool runner = 2;
  // The page to return.
  scylla.common.v1.PageRequest page = 3;
}

// The output of ListApps.
message ListAppsResponse {
  // The Apps of the page, oldest first.
  repeated App apps = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of DeleteApp.
message DeleteAppRequest {
  // The App to delete. Required.
  scylla.common.v1.Id app_id = 1;
}

// The output of DeleteApp.
message DeleteAppResponse {}

// The input of DisableApp.
message DisableAppRequest {
  // The App to disable. Required.
  scylla.common.v1.Id app_id = 1;
}

// The output of DisableApp.
message DisableAppResponse {
  // The App after the change.
  App app = 1;
}

// The input of EnableApp.
message EnableAppRequest {
  // The App to enable. Required.
  scylla.common.v1.Id app_id = 1;
}

// The output of EnableApp.
message EnableAppResponse {
  // The App after the change.
  App app = 1;
}

// The input of CreateJoinCode.
message CreateJoinCodeRequest {
  // The App. Required.
  scylla.common.v1.Id app_id = 1;
}

// The output of CreateJoinCode.
message CreateJoinCodeResponse {
  // The join code: one use, it expires at expires_at.
  string join_code = 1;
  // The end of the validity of the join code.
  google.protobuf.Timestamp expires_at = 2;
}

// The input of AddAppKey.
message AddAppKeyRequest {
  // The App. Required.
  scylla.common.v1.Id app_id = 1;
  // The Ed25519 public key, 32 bytes.
  bytes public_key = 2;
  // A name for the key: one line, 1 to 100 characters. Optional.
  string label = 3;
}

// The output of AddAppKey.
message AddAppKeyResponse {
  // The new key.
  AppKey key = 1;
}

// The input of RevokeAppKey.
message RevokeAppKeyRequest {
  // The App. Required.
  scylla.common.v1.Id app_id = 1;
  // The key to revoke. Required. A key that is already revoked does not change.
  scylla.common.v1.Id key_id = 2;
}

// The output of RevokeAppKey.
message RevokeAppKeyResponse {}

// The input of RenameAppKey.
message RenameAppKeyRequest {
  // The App. Required.
  scylla.common.v1.Id app_id = 1;
  // The key. Required.
  scylla.common.v1.Id key_id = 2;
  // The new name: one line, 1 to 100 characters.
  string label = 3;
}

// The output of RenameAppKey.
message RenameAppKeyResponse {
  // The key after the change.
  AppKey key = 1;
}

// The input of CreateAppToken.
message CreateAppTokenRequest {
  // The App.
  scylla.common.v1.Id app_id = 1;
  // The name of the token: one line, 1 to 100 characters.
  string name = 2;
  // The life of the token.
  scylla.auth.v1.TokenExpiry expiry = 3;
  // What its short tokens can do. Not set: read-only.
  scylla.auth.v1.TokenLimits limits = 4;
}

// The output of CreateAppToken.
message CreateAppTokenResponse {
  // The token.
  scylla.auth.v1.ApiToken token = 1;
  // The secret of the token, for TokenService.ExchangeApiToken. No other call gives it.
  string secret = 2;
}

// The input of ListAppTokens.
message ListAppTokensRequest {
  // The App.
  scylla.common.v1.Id app_id = 1;
}

// The output of ListAppTokens.
message ListAppTokensResponse {
  // The tokens, the newest first.
  repeated scylla.auth.v1.ApiToken tokens = 1;
}

// The input of RevokeAppToken.
message RevokeAppTokenRequest {
  // The App.
  scylla.common.v1.Id app_id = 1;
  // The token.
  scylla.common.v1.Id token_id = 2;
}

// The output of RevokeAppToken.
message RevokeAppTokenResponse {}
