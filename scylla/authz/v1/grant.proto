syntax = "proto3";

package scylla.authz.v1;

import "scylla/authz/v1/permission.proto";
import "scylla/common/v1/common.proto";

// Every RPC except ListGrantableRoles requires the manage-grants permission
// of the scope it touches: `manageSystemGrants` at system scope,
// `manageOrgGrants` on the organization, `manageProjectGrants` on the
// project. A grant held at an ancestor scope satisfies it. A change is live
// when the call returns: the next authorization check sees it.
service GrantService {
  // INVALID_ARGUMENT when the role is unknown or owned by another
  // organization, when its scope kind differs
  // from `scope`, or when it is an agent role (ROLE_KIND_AGENT) and the
  // principal is a user. FAILED_PRECONDITION when the principal or the scope
  // does not exist; when an app gets a grant outside the organization that
  // owns it; when a user gets a project grant without a grant on the
  // project's organization; when the caller grants a permission it does not
  // hold at the scope, at its organization or at system scope (full control
  // there allows any role). Repeating an existing grant (same principal, role
  // and scope) returns the stored grant and adds none.
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);
  // Revoking the last grant of a user that holds system-admin, or
  // organization-admin on an organization, when no other user holds it there
  // fails with FAILED_PRECONDITION; apps do not count, and a project may lose
  // its last project-admin. Revoking a user's last grant on an organization
  // also removes the user's grants on its projects, as RevokeAllAccess does.
  // An unknown grant_id needs `manageSystemGrants` and then succeeds without
  // change. An app's connected agent stream closes.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  // Removes every grant the principal holds at the scope and below it: an
  // organization covers its projects, the system every organization and
  // project. A system-scoped grant is never removed. FAILED_PRECONDITION when
  // the removal would leave the system or an organization without a user
  // holding its admin role. An app's connected agent stream closes.
  rpc RevokeAllAccess(RevokeAllAccessRequest) returns (RevokeAllAccessResponse);
  // Not paginated.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  // The roles a grant or an invitation may give: the platform roles, and
  // with `organization_id` the roles of that organization. Without
  // `organization_id` no permission is checked.
  rpc ListGrantableRoles(ListGrantableRolesRequest) returns (ListGrantableRolesResponse);
}

message Grant {
  scylla.common.v1.GrantId grant_id = 1;
  PrincipalRef principal = 2;
  ScopeRef scope = 3;
  scylla.common.v1.RoleId role = 4;
  reserved 5;
}

message CreateGrantRequest {
  PrincipalRef principal = 1;
  ScopeRef scope = 2;
  // Must exist; its scope kind must match `scope`.
  scylla.common.v1.RoleId role = 3;
  reserved 4;
}

// The stored grant. A repeated grant returns the original grant_id.
message CreateGrantResponse {
  Grant grant = 1;
}

message RevokeGrantRequest {
  scylla.common.v1.GrantId grant_id = 1;
}

message RevokeGrantResponse {}

message RevokeAllAccessRequest {
  PrincipalRef principal = 1;
  ScopeRef scope = 2;
}

message RevokeAllAccessResponse {
  // Grants removed; 0 when the principal held none there.
  uint64 revoked = 1;
}

message ListGrantsRequest {
  // Set: grants bound to exactly this scope, not below it. Unset: every grant
  // in the installation; requires `manageSystemGrants`.
  optional ScopeRef scope = 1;
}

message ListGrantsResponse {
  repeated Grant grants = 1;
}

message ListGrantableRolesRequest {
  // Set: only roles of this scope kind. SCOPE_KIND_UNSPECIFIED is rejected.
  optional ScopeKind scope_kind = 1;
  // Set: the platform roles and the roles of this organization; requires
  // `readOrganization` there. Unset: the platform roles.
  scylla.common.v1.OrganizationId organization_id = 2;
}

// For display only: a role confers its permission set, not this tag.
enum RoleKind {
  ROLE_KIND_UNSPECIFIED = 0;
  // Full control of the scope. system-admin and organization-admin are the
  // owner roles; see RevokeGrant.
  ROLE_KIND_ADMIN = 1;
  // Only an app may hold a role of this kind: CreateGrant and
  // CreateInvitation reject it for a user with INVALID_ARGUMENT.
  ROLE_KIND_AGENT = 2;
  // A human working inside the scope without administering it.
  ROLE_KIND_MEMBER = 3;
}

// A role the caller may pass as CreateGrantRequest.role.
message GrantableRole {
  // The value to pass as CreateGrantRequest.role.
  scylla.common.v1.RoleId role_id = 1;
  ScopeKind scope_kind = 2;
  RoleKind kind = 3;
  string description = 4;
  string name = 5;
  // Set for a role of that organization, absent for a platform role.
  scylla.common.v1.OrganizationId owner_organization_id = 6;
}

message ListGrantableRolesResponse {
  repeated GrantableRole roles = 1;
}
