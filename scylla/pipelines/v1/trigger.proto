syntax = "proto3";

package scylla.pipelines.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";

// A trigger of a pipeline: a cron schedule, a webhook, or an event of the linked repository that
// starts a job. The jobs of the triggers of a workspace have the runner of the triggers of the
// workspace as their author.
message Trigger {
  // The id of the trigger.
  scylla.common.v1.Id id = 1;
  // The pipeline.
  scylla.common.v1.Id pipeline_id = 2;
  // The project of the pipeline.
  scylla.common.v1.Id project_id = 3;
  // The workspace of the project.
  scylla.common.v1.Id workspace_id = 4;
  // The actor that created the trigger.
  scylla.common.v1.Id created_by = 5;
  // The display name, unique in the pipeline.
  string name = 6;
  // What starts the jobs.
  oneof kind {
    // A schedule.
    Cron cron = 7;
    // A webhook.
    Webhook webhook = 8;
    // A push to a branch of the linked repository.
    Push push = 17;
    // A pull request of the linked repository.
    PullRequest pull_request = 18;
    // A push of a tag of the linked repository.
    Tag tag = 19;
  }
  // The inputs: each node of a job gets them in its environment. A variable of the node with the
  // same name wins.
  repeated TriggerInput inputs = 9;
  // False stops the trigger: its schedule does not fire, and its webhook gives 404.
  bool enabled = 10;
  // The next fire of a schedule.
  google.protobuf.Timestamp next_fire_at = 11;
  // The last fire.
  google.protobuf.Timestamp last_fired_at = 12;
  // The result of the last fire.
  FireStatus last_status = 13;
  // The reason of a last fire that failed.
  string last_error = 14;
  // The creation time.
  google.protobuf.Timestamp created_at = 15;
  // The time of the last change.
  google.protobuf.Timestamp updated_at = 16;
  // True for a trigger from the on section of a pipeline file. It is read only: change the file.
  bool from_file = 20;
}

// A schedule of 5 cron fields (minute, hour, day of the month, month, day of the week), in UTC.
message Cron {
  // The schedule, for example "0 3 * * 1-5".
  string schedule = 1;
}

// A webhook. A request goes to POST /webhooks/{id} on the API URL, with the HMAC-SHA256 of the
// body in the header X-Scylla-Signature-256 or X-Hub-Signature-256, with or without the prefix
// sha256=. A key in X-Scylla-Delivery or X-GitHub-Delivery stops a second fire of one delivery.
message Webhook {
  // The path of the route of the trigger.
  string path = 1;
}

// The rules of a push trigger. A push to a matching branch starts one job for each pipeline and
// each new head commit. One commit has one job: a pull request on the same commit uses it.
message Push {
  // The globs of the branches, for example main or release/*. Empty gives each branch.
  repeated string branches = 1;
  // The globs of the branches to skip. They win over branches.
  repeated string exclude_branches = 2;
  // True skips a commit with [skip ci] in its message.
  bool skip_ci = 3;
}

// The rules of a pull request trigger: a pull request on GitHub, a merge request on GitLab. A
// pull request from a fork waits for an approval, and its job never gets a secret value.
message PullRequest {
  // The globs of the target branches. Empty gives each branch.
  repeated string branches = 1;
  // The events that start a job. Empty gives each event.
  repeated PullRequestEvent events = 2;
  // True also starts a job for a draft pull request.
  bool drafts = 3;
}

// An event of a pull request.
enum PullRequestEvent {
  // Not used.
  PULL_REQUEST_EVENT_UNSPECIFIED = 0;
  // The pull request was opened.
  PULL_REQUEST_EVENT_OPENED = 1;
  // The pull request got new commits.
  PULL_REQUEST_EVENT_SYNCHRONIZED = 2;
  // The pull request was opened again.
  PULL_REQUEST_EVENT_REOPENED = 3;
  // A draft pull request became ready for review.
  PULL_REQUEST_EVENT_READY_FOR_REVIEW = 4;
}

// The rules of a tag trigger.
message Tag {
  // The globs of the tags, for example v*. Empty gives each tag.
  repeated string patterns = 1;
}

// An input of a trigger.
message TriggerInput {
  // The name of the variable.
  string name = 1;
  // The value. Required.
  oneof value {
    // A text.
    string literal = 2;
    // A JSON pointer into the body of a webhook, for example /after. A missing value gives 422.
    // A fire with no body gives an empty text.
    string json_pointer = 3;
  }
}

// The result of the last fire of a trigger.
enum FireStatus {
  // No fire yet.
  FIRE_STATUS_UNSPECIFIED = 0;
  // The fire made a job.
  FIRE_STATUS_OK = 1;
  // The fire failed. last_error tells why.
  FIRE_STATUS_ERROR = 2;
}
