syntax = "proto3";

package scylla.pipelines.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";
import "scylla/pipelines/v1/job.proto";
import "scylla/pipelines/v1/job_stats.proto";
import "scylla/pipelines/v1/source.proto";

// Reads, stops, deletes, runs again, approves, rejects, lists and counts the jobs, and follows
// their logs. Each RPC needs an authenticated actor, else UNAUTHENTICATED. An unknown job gives
// PERMISSION_DENIED, as a refusal does.
service JobService {
  // Reads one job, with the state of each node.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  // Cancels a job that waits for an approval, a pending job or a running job. Its agent stops
  // it. A job that ended does not change.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // Deletes a job with its logs. The agent stops a running job.
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  // Starts a new job with the nodes, the pipeline, the trigger, the commit, the pipeline file
  // and the checkout settings of a job that ended. The secrets resolve again: a secret that the
  // project does not have gives NOT_FOUND. A job from a fork waits for an approval again, and a
  // job of a pipeline file with errors fails at once. The server does not call the provider: a
  // job that gets the code fails at its dispatch when its project has no active link to the
  // repository. A job that did not end gives FAILED_PRECONDITION with the reason JOB_NOT_ENDED.
  rpc RerunJob(RerunJobRequest) returns (RerunJobResponse);
  // Approves a job from a fork that waits for an approval: it becomes pending, and runs with no
  // secret value. A job in another state gives FAILED_PRECONDITION with the reason
  // JOB_NOT_AWAITING_APPROVAL. The route permission is approve_job: the editors of the project,
  // and the members of its workspace.
  rpc ApproveJob(ApproveJobRequest) returns (ApproveJobResponse);
  // Rejects a job from a fork that waits for an approval: it becomes cancelled, and no agent runs
  // it. A job in another state gives FAILED_PRECONDITION with the reason
  // JOB_NOT_AWAITING_APPROVAL. The route permission is reject_job: the editors of the project, and
  // the members of its workspace.
  rpc RejectJob(RejectJobRequest) returns (RejectJobResponse);
  // Lists the jobs of a pipeline, newest first. A bad filter gives INVALID_ARGUMENT.
  rpc ListPipelineJobs(ListPipelineJobsRequest) returns (ListPipelineJobsResponse);
  // Lists the jobs of a workspace, newest first, in the projects that the caller can see: each
  // project for a reader of the workspace, and the projects where the caller is a viewer. The
  // route permission is list_workspace_jobs, on the workspace or on a project. A filter never
  // causes a refusal: a caller with no role, or an unknown workspace, gets an empty list. A bad
  // filter, or more than 100 project or pipeline ids, gives INVALID_ARGUMENT.
  rpc ListWorkspaceJobs(ListWorkspaceJobsRequest) returns (ListWorkspaceJobsResponse);
  // Returns the figures of the jobs of a workspace for a period, in the projects that the caller
  // can see: the totals, the buckets, the groups, and the totals of the previous period. A job
  // counts in the period of its creation. The hours, days and weeks are in the time zone of the
  // workspace. The route permission is get_job_stats, on the workspace (its readers see each
  // project) or on a project (its viewers). A filter never causes a refusal: a caller with no
  // role, or an unknown workspace, gets figures at 0. No from, a to that is not after from, a
  // period of more than 400 days, more than 1000 buckets, a group limit above 100, more than 100
  // project or pipeline ids, or JOB_ORIGIN_UNSPECIFIED in origins gives INVALID_ARGUMENT.
  rpc GetJobStats(GetJobStatsRequest) returns (GetJobStatsResponse);
  // Sends the logs of a job after a cursor, then the new logs while the job runs. The stream
  // ends after the last logs of a job that ended.
  rpc TailJobLogs(TailJobLogsRequest) returns (stream TailJobLogsResponse);
}

// The input of GetJob.
message GetJobRequest {
  // The job. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of GetJob.
message GetJobResponse {
  // The job.
  Job job = 1;
}

// The input of CancelJob.
message CancelJobRequest {
  // The job. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of CancelJob.
message CancelJobResponse {
  // The job after the cancel.
  Job job = 1;
}

// The input of DeleteJob.
message DeleteJobRequest {
  // The job. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of DeleteJob.
message DeleteJobResponse {}

// The input of RerunJob.
message RerunJobRequest {
  // The job that ended. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of RerunJob.
message RerunJobResponse {
  // The new job: pending, waiting for an approval for a job from a fork, or failed for a
  // pipeline file with errors.
  Job job = 1;
}

// The input of ApproveJob.
message ApproveJobRequest {
  // The job that waits for an approval. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of ApproveJob.
message ApproveJobResponse {
  // The pending job.
  Job job = 1;
}

// The input of RejectJob.
message RejectJobRequest {
  // The job that waits for an approval. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of RejectJob.
message RejectJobResponse {
  // The cancelled job.
  Job job = 1;
}

// The filters of a list of jobs. A job must match each filter that is set. A job with no source
// matches no filter of the source: branch, event, author_login and pull_request.
message JobFilter {
  // Only the jobs of this branch.
  string branch = 1;
  // Only the jobs of this event. Not set gives each event.
  SourceEvent event = 2;
  // Only the jobs of the commits of this author login on the provider.
  string author_login = 3;
  // Only the jobs of this pull request number. 0 gives each job.
  uint32 pull_request = 4;
  // Only the jobs in one of these states. Empty gives each state. JOB_STATUS_UNSPECIFIED gives
  // INVALID_ARGUMENT.
  repeated JobStatus statuses = 5;
  // Only the jobs created at this time or later.
  google.protobuf.Timestamp created_after = 6;
  // Only the jobs created before this time.
  google.protobuf.Timestamp created_before = 7;
  // Only the jobs with one of these origins. Empty gives each origin. JOB_ORIGIN_UNSPECIFIED gives
  // INVALID_ARGUMENT.
  repeated JobOrigin origins = 8;
}

// How much of each job a list gives.
enum JobView {
  // Not set: JOB_VIEW_FULL.
  JOB_VIEW_UNSPECIFIED = 0;
  // Each field of the job.
  JOB_VIEW_FULL = 1;
  // Each field of the job but nodes. The state of each node stays in runs, with its attempt and
  // its max_attempts.
  JOB_VIEW_SUMMARY = 2;
}

// The input of ListPipelineJobs.
message ListPipelineJobsRequest {
  // The pipeline. Required.
  scylla.common.v1.Id pipeline_id = 1;
  // The page to return.
  scylla.common.v1.PageRequest page = 2;
  // The filters. Not set gives all the jobs.
  JobFilter filter = 3;
}

// The output of ListPipelineJobs.
message ListPipelineJobsResponse {
  // The jobs of the page, newest first.
  repeated Job jobs = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of ListWorkspaceJobs.
message ListWorkspaceJobsRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
  // Only the jobs of this agent. Not set gives all the jobs.
  scylla.common.v1.Id agent_id = 2;
  // The page to return.
  scylla.common.v1.PageRequest page = 3;
  // The filters. Not set gives all the jobs.
  JobFilter filter = 4;
  // Only the jobs of these projects, at most 100. Empty gives each project that the caller can
  // see. A project that the caller cannot see gives no job.
  repeated scylla.common.v1.Id project_ids = 5;
  // Only the jobs of these pipelines, at most 100. Empty gives each pipeline.
  repeated scylla.common.v1.Id pipeline_ids = 6;
  // How much of each job to give. Not set gives JOB_VIEW_FULL.
  JobView view = 7;
}

// The output of ListWorkspaceJobs.
message ListWorkspaceJobsResponse {
  // The jobs of the page, newest first.
  repeated Job jobs = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of GetJobStats.
message GetJobStatsRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
  // Only the jobs of these projects, at most 100. Empty gives each project that the caller can
  // see. A project that the caller cannot see gives no job.
  repeated scylla.common.v1.Id project_ids = 2;
  // Only the jobs of these pipelines, at most 100. Empty gives each pipeline.
  repeated scylla.common.v1.Id pipeline_ids = 3;
  // Only the jobs of this agent. Not set gives all the jobs.
  scylla.common.v1.Id agent_id = 4;
  // Only the jobs with one of these origins. Empty gives each origin.
  repeated JobOrigin origins = 5;
  // The start of the period: the jobs created at this time or later. Required.
  google.protobuf.Timestamp from = 6;
  // The end of the period: the jobs created before this time. Not set: now.
  google.protobuf.Timestamp to = 7;
  // The size of the buckets. Not set gives no bucket.
  JobStatsBucket bucket = 8;
  // What makes the groups. Not set gives no group.
  JobStatsGroup group_by = 9;
  // The order of the groups. Not set gives JOB_STATS_ORDER_COUNT.
  JobStatsOrder group_order = 10;
  // The most groups to give, at most 100. 0 gives 20.
  uint32 group_limit = 11;
  // Also give the figures of the previous period: the period of the same length that ends at
  // from.
  bool compare = 12;
}

// The output of GetJobStats.
message GetJobStatsResponse {
  // The jobs of the period.
  JobFigures totals = 1;
  // Each bucket of the period, oldest first, also the buckets with no job.
  repeated JobBucket buckets = 2;
  // The first groups in the order of the request.
  repeated JobGroup groups = 3;
  // The jobs of the previous period. Set when compare is true.
  JobFigures previous = 4;
  // The IANA time zone of the workspace, for example Europe/Paris: the buckets start at the
  // hours, days and weeks of this zone.
  string time_zone = 5;
}

// The input of TailJobLogs.
message TailJobLogsRequest {
  // The job. Required.
  scylla.common.v1.Id job_id = 1;
  // Only the logs of this node. Empty gives the logs of each node.
  string node_id = 2;
  // The cursor of the last message that the client got. Empty starts at the first logs.
  string after = 3;
}

// One batch of lines of one node.
message TailJobLogsResponse {
  // The cursor of this batch, to give as after when the client follows the logs again.
  string cursor = 1;
  // The node of the lines.
  string node_id = 2;
  // The lines, in order.
  repeated LogLine lines = 3;
}
