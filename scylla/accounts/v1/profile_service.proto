syntax = "proto3";

package scylla.accounts.v1;

import "google/protobuf/timestamp.proto";
import "scylla/accounts/v1/user.proto";
import "scylla/common/v1/icon.proto";
import "scylla/common/v1/id.proto";

// The account of the caller: its profile, its email, its password, its identities and its
// sessions. Each RPC needs the token of a user, else UNAUTHENTICATED or PERMISSION_DENIED.
service ProfileService {
  // Returns the user of the caller, with its handle and its instance admin flag, and its
  // acceptance of the terms of service.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  // Changes the display name, the handle or the avatar. A handle of another user gives
  // FAILED_PRECONDITION with the reason HANDLE_IN_USE. A bad name, handle, image, color or glyph
  // avatar gives INVALID_ARGUMENT.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Deletes the account. It needs the current password if the user has one. A workspace where
  // the user is the only owner is deleted with the account if it is empty. Else the request
  // gives FAILED_PRECONDITION with the reason LAST_OWNER, and the ErrorInfo metadata
  // "workspace_ids" names those workspaces. The last active instance admin gives LAST_ADMIN.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // Sends a link to the new email, after the answer. It needs the current password if the user
  // has one. The answer is the same if an account uses the email, and the server sends at most
  // one link each 60 seconds for one user and for one email.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  // Makes the new email the primary verified email, with the token of the link. Each other open
  // link of the user stops: a link to the old email does not work any more. The old email gets a
  // notice.
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse);
  // Changes the password. It needs the current password if the user has one, and closes the
  // other sessions.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Lists the identities of the user at the identity providers.
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  // Removes an identity. The last way to sign in cannot be removed: FAILED_PRECONDITION.
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
  // Downloads again the photo of an identity of the user at its provider (the GitHub avatar, the
  // OIDC claim "picture"), and makes it the image of the avatar, as UpdateProfile does with an
  // upload. It replaces the current image. An unknown identity gives NOT_FOUND. An identity with no
  // photo gives FAILED_PRECONDITION with the reason NO_PICTURE. A photo that the server cannot
  // download or read gives FAILED_PRECONDITION with the reason PICTURE_UNAVAILABLE. The server
  // also does this one time when it makes an account with a provider.
  rpc ImportAvatar(ImportAvatarRequest) returns (ImportAvatarResponse);
  // Lists the open sessions of the user, newest first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Closes one session of the user. Its tokens stop at once.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // Closes each session of the user, except the session of the request.
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);
  // Returns a copy of the data of the account, as one JSON document: the profile, the emails,
  // the identities, the sessions, the metadata of the personal tokens (never a secret), the
  // state of the web app, the acceptances of the terms of service, the workspaces and the roles,
  // and the data that the edition adds. A personal token with the read-only preset gets
  // PERMISSION_DENIED.
  rpc ExportAccountData(ExportAccountDataRequest) returns (ExportAccountDataResponse);
  // Records that the user accepts the current version of the terms of service. A version that
  // is not the version of the terms of the instance (LegalService.GetLegalInfo) gives
  // FAILED_PRECONDITION with the reason TERMS_NOT_ACCEPTED, and the ErrorInfo metadata "version"
  // names the current version, empty when the terms are off. A second acceptance of one version
  // keeps the first one.
  rpc AcceptTerms(AcceptTermsRequest) returns (AcceptTermsResponse);
}

// The input of GetMe.
message GetMeRequest {}

// The output of GetMe.
message GetMeResponse {
  // The user of the caller.
  User user = 1;
  // True while the terms of service of the instance need an acceptance and the user did not
  // accept their current version. The web app then shows the terms before the app.
  bool terms_acceptance_required = 2;
  // The last version of the terms of service that the user accepted. Not set: none.
  TermsAcceptance accepted_terms = 3;
}

// An acceptance of a version of the terms of service by a user.
message TermsAcceptance {
  // The version that the user accepted.
  string version = 1;
  // The time of the acceptance.
  google.protobuf.Timestamp accepted_at = 2;
}

// The input of UpdateProfile. A field that is not set does not change.
message UpdateProfileRequest {
  // The new display name, 1 to 100 characters after trim.
  optional string display_name = 1;
  // The new handle: 2 to 39 lower case letters, digits, dots, dashes or underscores, that start
  // with a letter or a digit. An empty text removes the handle.
  optional string handle = 2;
  // The new image of the avatar: a PNG, JPEG or WebP file of at most 1048576 bytes (1 MiB), and
  // at most 4096 pixels on each side. The server makes it a square PNG of 256 pixels: it cuts
  // the center of the longer side. It replaces the old image, which the server deletes. Empty
  // bytes remove the image. Another format (SVG too), a larger file or a file that the server
  // cannot read gives INVALID_ARGUMENT.
  optional bytes avatar_image = 3;
  // The new color of the initials: the name of a color of the web app (1 to 32 lower case
  // letters, digits or dashes, with a letter first), or "#rrggbb". An empty text gives the
  // default color.
  optional string avatar_color = 4;
  // A new glyph avatar: the server draws it as an SVG image, which replaces the old image as a new
  // avatar_image does. The avatar keeps its options for the editor. It cannot come with
  // avatar_image. Bad options give INVALID_ARGUMENT.
  scylla.common.v1.GlyphAvatar avatar_glyph = 5;
}

// The output of UpdateProfile.
message UpdateProfileResponse {
  // The user after the change.
  User user = 1;
}

// The input of DeleteAccount.
message DeleteAccountRequest {
  // The current password. Required if the user has a password.
  string password = 1;
}

// The output of DeleteAccount.
message DeleteAccountResponse {}

// The input of RequestEmailChange.
message RequestEmailChangeRequest {
  // The new email address.
  string new_email = 1;
  // The current password. Required if the user has a password.
  string password = 2;
}

// The output of RequestEmailChange. It is the same for a free and a used email.
message RequestEmailChangeResponse {}

// The input of ConfirmEmailChange.
message ConfirmEmailChangeRequest {
  // The token of the link in the mail.
  string token = 1;
}

// The output of ConfirmEmailChange.
message ConfirmEmailChangeResponse {
  // The user after the change.
  User user = 1;
}

// The input of ChangePassword.
message ChangePasswordRequest {
  // The current password. Required if the user has a password.
  string current_password = 1;
  // The new password, 8 to 128 characters.
  string new_password = 2;
}

// The output of ChangePassword.
message ChangePasswordResponse {}

// The input of ListIdentities.
message ListIdentitiesRequest {}

// The output of ListIdentities.
message ListIdentitiesResponse {
  // The identities of the user.
  repeated Identity identities = 1;
  // True if the user can also sign in with a password.
  bool has_password = 2;
}

// An identity of a user at an identity provider.
message Identity {
  // The slug of the provider.
  string provider = 1;
  // The id of the person at the provider.
  string subject = 2;
  // The email that the provider gave, if any.
  string email = 3;
  // The time of the link.
  google.protobuf.Timestamp linked_at = 4;
  // True if the provider gave a photo of the person at the last sign-in or link. ImportAvatar
  // uses it.
  bool has_picture = 5;
}

// The input of UnlinkIdentity.
message UnlinkIdentityRequest {
  // The slug of the provider.
  string provider = 1;
  // The id of the person at the provider.
  string subject = 2;
}

// The output of UnlinkIdentity.
message UnlinkIdentityResponse {}

// The input of ImportAvatar.
message ImportAvatarRequest {
  // The slug of the provider.
  string provider = 1;
  // The id of the person at the provider.
  string subject = 2;
}

// The output of ImportAvatar.
message ImportAvatarResponse {
  // The user after the change.
  User user = 1;
}

// The input of ListSessions.
message ListSessionsRequest {}

// The output of ListSessions.
message ListSessionsResponse {
  // The open sessions, newest first.
  repeated Session sessions = 1;
}

// The input of RevokeSession.
message RevokeSessionRequest {
  // The session to close. Required.
  scylla.common.v1.Id session_id = 1;
}

// The output of RevokeSession.
message RevokeSessionResponse {}

// The input of RevokeOtherSessions.
message RevokeOtherSessionsRequest {}

// The output of RevokeOtherSessions.
message RevokeOtherSessionsResponse {}

// The input of ExportAccountData.
message ExportAccountDataRequest {}

// The output of ExportAccountData.
message ExportAccountDataResponse {
  // The data of the account, as one JSON document in UTF-8. Its key "format" names the version
  // of its structure.
  string json = 1;
  // The time of the export.
  google.protobuf.Timestamp exported_at = 2;
}

// The input of AcceptTerms.
message AcceptTermsRequest {
  // The version of the terms of service that the user accepts.
  string version = 1;
}

// The output of AcceptTerms.
message AcceptTermsResponse {
  // The acceptance of the version, or the first acceptance of the same version.
  TermsAcceptance acceptance = 1;
}
