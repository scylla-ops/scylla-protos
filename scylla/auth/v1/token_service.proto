syntax = "proto3";

package scylla.auth.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";

// Gives short-lived tokens. Each other RPC needs a token in "authorization: Bearer <token>".
service TokenService {
  // Exchanges an assertion that an App signed with its private key for a token. A revoked key,
  // a deleted App, a replayed nonce or a bad signature gives UNAUTHENTICATED.
  rpc ExchangeAppAssertion(ExchangeAppAssertionRequest) returns (ExchangeAppAssertionResponse);
  // Uses a join code of an App: the machine of the App sends the public key of a key pair that it
  // made. The private key never leaves the machine. A code works one time, before its expiry. An
  // unknown, used or expired code gives UNAUTHENTICATED.
  rpc JoinApp(JoinAppRequest) returns (JoinAppResponse);
  // Exchanges an OIDC ID token of a person for a token and a session. The issuer of the ID
  // token must be an identity provider of the server. The first exchange can create the user,
  // as the provider and the sign-up mode allow.
  rpc ExchangeIdToken(ExchangeIdTokenRequest) returns (ExchangeIdTokenResponse);
  // Exchanges the refresh token of a session for a new token and a new refresh token. The old
  // refresh token stops. A refresh token that is used two times closes its session.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Closes the session of a refresh token. Its tokens stop at once.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // Exchanges the secret of an API token for a token of its actor, inside the limits of the API
  // token. An unknown, revoked or expired secret gives UNAUTHENTICATED. The secret of a disabled
  // App gives FAILED_PRECONDITION with the reason APP_DISABLED, and a personal token on a server
  // with the personal tokens off gives the reason PERSONAL_TOKENS_DISABLED.
  rpc ExchangeApiToken(ExchangeApiTokenRequest) returns (ExchangeApiTokenResponse);
  // Exchanges the ID token of a CI job for a token of an App, with no secret: a CI identity of
  // the App must match its issuer, its repository, and its ref and environment if it names them.
  // The audience of the ID token must be the URL of this server. Another ID token gives
  // UNAUTHENTICATED, and a disabled App gives FAILED_PRECONDITION with the reason APP_DISABLED.
  rpc ExchangeCiToken(ExchangeCiTokenRequest) returns (ExchangeCiTokenResponse);
}

// The input of ExchangeAppAssertion.
message ExchangeAppAssertionRequest {
  // The encoded scylla.apps.v1.AppAssertion.
  bytes assertion = 1;
  // The Ed25519 signature of the assertion bytes.
  bytes signature = 2;
}

// The output of ExchangeAppAssertion.
message ExchangeAppAssertionResponse {
  // The token. It stops at once when its key is revoked or its App is deleted.
  IssuedToken token = 1;
}

// The input of JoinApp.
message JoinAppRequest {
  // The join code from AppService.CreateApp or AppService.CreateJoinCode.
  string join_code = 1;
  // The Ed25519 public key of the machine, 32 bytes.
  bytes public_key = 2;
  // A name for the key, for example the host name of the machine: one line, 1 to 100
  // characters. Optional.
  string label = 3;
}

// The output of JoinApp.
message JoinAppResponse {
  // The App.
  scylla.common.v1.Id app_id = 1;
  // The new key, to put in each AppAssertion.
  scylla.common.v1.Id key_id = 2;
}

// The input of ExchangeIdToken.
message ExchangeIdTokenRequest {
  // The ID token from the identity provider.
  string id_token = 1;
}

// The output of ExchangeIdToken.
message ExchangeIdTokenResponse {
  // The token.
  IssuedToken token = 1;
  // The refresh token of the new session.
  string refresh_token = 2;
}

// The input of Refresh.
message RefreshRequest {
  // The refresh token. Empty means the token of the session cookie of a browser.
  string refresh_token = 1;
}

// The output of Refresh.
message RefreshResponse {
  // The new access token.
  IssuedToken token = 1;
  // The new refresh token. Empty when the cookie holds it.
  string refresh_token = 2;
}

// The input of SignOut.
message SignOutRequest {
  // The refresh token. Empty means the token of the session cookie of a browser.
  string refresh_token = 1;
}

// The output of SignOut.
message SignOutResponse {}

// A Biscuit token. The holder can attenuate it before it gives it to another process.
message IssuedToken {
  // The token in base64. Send it as "authorization: Bearer <value>".
  string value = 1;
  // The end of the validity of the token.
  google.protobuf.Timestamp expires_at = 2;
}

// The input of ExchangeApiToken.
message ExchangeApiTokenRequest {
  // The secret of the API token.
  string api_token = 1;
}

// The output of ExchangeApiToken.
message ExchangeApiTokenResponse {
  // The token. It stops at once when its API token is revoked or its App is deleted or
  // disabled.
  IssuedToken token = 1;
}

// The input of ExchangeCiToken.
message ExchangeCiTokenRequest {
  // The App.
  scylla.common.v1.Id app_id = 1;
  // The ID token of the CI job.
  string id_token = 2;
}

// The output of ExchangeCiToken.
message ExchangeCiTokenResponse {
  // The token of the App, inside the limits of the CI identity.
  IssuedToken token = 1;
}
