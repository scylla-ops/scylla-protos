syntax = "proto3";

package scylla.integrations.v1;

import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";
import "scylla/integrations/v1/vcs.proto";

// Links a project to a repository of a connection of its workspace, and reads the branches and
// the tags of the repository. Each RPC needs an authenticated actor, else UNAUTHENTICATED. An
// unknown project gives PERMISSION_DENIED, as a refusal does. A call to the provider that fails
// gives FAILED_PRECONDITION with the reason PROVIDER_REFUSED or PROVIDER_UNAVAILABLE. A server
// with no GitHub App for the connection gives the reason APP_MISSING, and a server with no key
// of the secrets gives the reason SECRET_KEY_MISSING.
service RepositoryService {
  // Reads the link of a project. A project with no link gives an answer with no link. The route
  // permission is get_repository_link: the readers of the project.
  rpc GetRepositoryLink(GetRepositoryLinkRequest) returns (GetRepositoryLinkResponse);
  // Links a project to a repository. On GitLab, the server also makes the webhook of the
  // project when the service account is Maintainer or more. A Developer gets the polling mode
  // with the reason ROLE_TOO_LOW, and the link stays active. A project with a link gives
  // FAILED_PRECONDITION with the reason
  // REPOSITORY_ALREADY_LINKED, and a repository that the connection cannot see gives the reason
  // REPOSITORY_NOT_VISIBLE. A connection of another workspace gives PERMISSION_DENIED. The route
  // permission is link_repository: the editors of the project.
  rpc LinkRepository(LinkRepositoryRequest) returns (LinkRepositoryResponse);
  // Changes the reports and the polling of a link. A field that is not set does not change. A
  // project with no link gives FAILED_PRECONDITION with the reason NO_REPOSITORY_LINK. The route
  // permission is update_repository_link: the editors of the project.
  rpc UpdateRepositoryLink(UpdateRepositoryLinkRequest) returns (UpdateRepositoryLinkResponse);
  // Removes the link of a project. Its Git triggers, its reports and its merge rules stop. The
  // server removes the GitLab webhook that it made, when it can. The merge rules stay on the
  // provider: remove them there. The jobs stay. A project with no link gives
  // FAILED_PRECONDITION with the reason NO_REPOSITORY_LINK. The route permission is
  // unlink_repository: the editors of the project.
  rpc UnlinkRepository(UnlinkRepositoryRequest) returns (UnlinkRepositoryResponse);
  // Asks the provider for a test webhook, and tells if it arrived within 10 seconds. A link in
  // polling mode goes back to webhook mode when it arrives. A webhook that does not arrive moves
  // the link to the polling mode with the reason WEBHOOKS_NOT_ARRIVING, and on GitHub its
  // connection too. A project with no link gives
  // FAILED_PRECONDITION with the reason NO_REPOSITORY_LINK. The route permission is
  // test_delivery: the editors of the project.
  rpc TestDelivery(TestDeliveryRequest) returns (TestDeliveryResponse);
  // Lists the branches and the tags of the linked repository, in the order of the provider. A
  // project with no link gives FAILED_PRECONDITION with the reason NO_REPOSITORY_LINK. The route
  // permission is list_refs: the readers of the project.
  rpc ListRefs(ListRefsRequest) returns (ListRefsResponse);
}

// The input of GetRepositoryLink.
message GetRepositoryLinkRequest {
  // The project. Required.
  scylla.common.v1.Id project_id = 1;
}

// The output of GetRepositoryLink.
message GetRepositoryLinkResponse {
  // The link. Not set when the project has no link.
  RepositoryLink link = 1;
}

// The input of LinkRepository.
message LinkRepositoryRequest {
  // The project. Required.
  scylla.common.v1.Id project_id = 1;
  // The connection, of the workspace of the project. Required.
  scylla.common.v1.Id connection_id = 2;
  // The id of the repository on the provider, from ListConnectionRepositories. Required.
  string external_id = 3;
}

// The output of LinkRepository.
message LinkRepositoryResponse {
  // The new link.
  RepositoryLink link = 1;
}

// The input of UpdateRepositoryLink. A field that is not set does not change.
message UpdateRepositoryLinkRequest {
  // The project. Required.
  scylla.common.v1.Id project_id = 1;
  // True reports the results of the pipelines to the provider.
  optional bool reports_enabled = 2;
  // The new report mode. A check run on GitLab gives INVALID_ARGUMENT.
  ReportMode report_mode = 3;
  // The time between two polls in polling mode, 60 to 900 seconds, else INVALID_ARGUMENT.
  optional uint32 poll_interval_seconds = 4;
}

// The output of UpdateRepositoryLink.
message UpdateRepositoryLinkResponse {
  // The link after the change.
  RepositoryLink link = 1;
}

// The input of UnlinkRepository.
message UnlinkRepositoryRequest {
  // The project. Required.
  scylla.common.v1.Id project_id = 1;
}

// The output of UnlinkRepository.
message UnlinkRepositoryResponse {}

// The input of TestDelivery.
message TestDeliveryRequest {
  // The project. Required.
  scylla.common.v1.Id project_id = 1;
}

// The output of TestDelivery.
message TestDeliveryResponse {
  // True when the test webhook arrived.
  bool delivered = 1;
  // Why the test failed, as a short text. Empty when it arrived.
  string error = 2;
  // The link after the test.
  RepositoryLink link = 3;
}

// The input of ListRefs.
message ListRefsRequest {
  // The project. Required.
  scylla.common.v1.Id project_id = 1;
  // Only the branches, or only the tags. Not set gives both.
  GitRefKind kind = 2;
  // Only the refs with this text in their name. Empty gives all.
  string search = 3;
  // The page to return.
  scylla.common.v1.PageRequest page = 4;
}

// The output of ListRefs.
message ListRefsResponse {
  // The refs of the page. The default branch comes first.
  repeated GitRefInfo refs = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}
